
networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge

volumes:
  vault-data:
  vault-keys:
  db-data:
  minio-data:

services:
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    networks:
      - private-net
    volumes:
      - vault-data:/vault/file
      - vault-keys:/vault-keys
      - ./vault-config:/vault/config
    command: vault server -config=/vault/config/vault.hcl
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status -address=http://127.0.0.1:8200 2>&1; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 2 ]"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - private-net
    volumes:
      - ./scripts:/scripts
      - vault-keys:/vault-keys
    environment:
      - VAULT_ADDR=http://vault:8200
      - POSTGRES_USER=archiver
      - POSTGRES_DB=documents_db
    entrypoint: ["/bin/sh", "/scripts/setup_vault.sh"]
    restart: "no"

  db:
    image: postgres:15-alpine
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks:
      - private-net
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
      - ./scripts/db-entrypoint.sh:/usr/local/bin/db-entrypoint.sh
      - vault-keys:/vault-keys:ro
    environment:
      - VAULT_ADDR=http://vault:8200
    entrypoint: ["/usr/local/bin/db-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiver -d documents_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks:
      - private-net
    volumes:
      - minio-data:/data
      - ./scripts/minio-entrypoint.sh:/usr/local/bin/minio-entrypoint.sh
      - vault-keys:/vault-keys:ro
    environment:
      - VAULT_ADDR=http://vault:8200
    entrypoint: ["/usr/local/bin/minio-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - private-net
    volumes:
      - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh
      - vault-keys:/vault-keys:ro
    environment:
      - VAULT_ADDR=http://vault:8200
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    restart: "no"

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - private-net
    volumes:
      - vault-keys:/vault-keys:ro
    environment:
      - VAULT_ADDR=http://vault:8200
      - DB_HOST=db
      - DB_PORT=5432
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=documents
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public-net
      - private-net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
